<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Cross-Origin-Opener-Policy and Cross-Origin-Embedder-Policy are required
    for SharedArrayBuffer (used by multi-threaded WASM in transformers.js).
    These are set via manifest.json content_security_policy for extension pages.
  -->
  <title>EdgeAI Offscreen</title>
</head>
<body>
  <!-- Hidden audio element to maintain AUDIO_PLAYBACK offscreen reason -->
  <audio id="keepalive-audio" loop muted></audio>

  <!-- The offscreen document is invisible. All work happens in the script. -->
  <script type="module" src="./offscreen.ts"></script>
</body>
</html>
